{% extends "base.html" %}
{% load i18n %}
{% load static %}
{% block title %}{% trans "Edit Post" %}{% endblock %}

{% block content %}
<h1 class="mb-3">{% trans "Edit Post" %}</h1>
{{ form.media }}
<form method="post" class="mb-4">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    <h5>{% trans "Post" %}</h5>
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary float-end btn-lg mb-4">{% trans "Update" %}</button>
</form>
{% endblock %}
